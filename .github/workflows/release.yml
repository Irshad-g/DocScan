name: Android Release

on:
  push:
    tags:
      - 'v*' # e.g. v1.0.0

permissions:
  contents: write # upload the APK to the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: '**/*.gradle.kts'

      # Release is signed with the debug key; it must be the same key whose SHA-1 / hash are
      # registered with Google and Entra ID, or sign-in breaks and the APK won't update over the old one.
      - name: Restore Signing Key
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Build Release APK
        env:
          APPLICATION_CLIENT_ID: ${{ secrets.APPLICATION_CLIENT_ID }}
          SIGNATURE_HASH: ${{ secrets.SIGNATURE_HASH }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "DocScan-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: DocScan-${{ github.ref_name }}.apk
